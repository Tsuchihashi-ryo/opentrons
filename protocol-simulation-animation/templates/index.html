<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロトコルアニメーションジェネレーター</title>
    <style>
        body { font-family: sans-serif; margin: 2em; text-align: center; }
        h1 { color: #333; }
        .container { max-width: 600px; margin: auto; padding: 2em; border: 1px solid #ccc; border-radius: 5px; }
        input[type="submit"] { background-color: #007bff; color: white; padding: 15px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.2em; }
        input[type="submit"]:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>プロトコルアニメーションジェネレーター</h1>
        <p>下のボタンを押して、サンプルプロトコルのアニメーションを生成します。</p>
        <br>
        <form action="/animate" method="post">
            <input type="submit" value="アニメーションを生成">
        </form>
    </div>
</body>
</html>
